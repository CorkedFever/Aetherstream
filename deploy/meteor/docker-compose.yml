# Aetherstream's server: the party service and the stream relay. Lives at /opt/aetherstream.
#
#   ./setup.sh aetherstream.example.com     # once — generates secrets and the real config files
#   docker compose up -d
#
# TLS and routing are not part of this stack. Caddy lives in corkedfever-website's
# deploy/meteor (/opt/corkedfever), which owns the box's front door for every site on it and
# creates the `corkedfever` network. The two services here join that network so Caddy reaches
# them by container name (aether-api:8099, aether-stream:8888), and keep this stack's own
# default network too, which MediaMTX uses to call party-api's /auth. Start corkedfever's
# stack first: this one expects its network to exist.

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: aether-stream
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # SRT ingest — the only port MediaMTX itself opens to the internet. Encrypted with a
      # passphrase, UDP, and it recovers from packet loss instead of stalling like RTMP-over-TCP.
      # HLS (8888) stays internal; corkedfever's Caddy proxies to it across the shared network.
      - "8890:8890/udp"
    networks: [default, corkedfever]

  party-api:
    image: python:3.12-alpine
    container_name: aether-api
    restart: unless-stopped
    working_dir: /app
    command: python -u app.py
    volumes:
      - ./app.py:/app/app.py:ro
      - party-api-data:/data
    env_file:
      - api.env
    networks: [default, corkedfever]

networks:
  corkedfever:
    external: true

volumes:
  # Parties are permanent identities; this holds state.json and must survive restarts.
  party-api-data:
